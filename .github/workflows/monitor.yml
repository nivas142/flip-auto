name: Flip Auto Monitor

on:
  workflow_dispatch:
  schedule:
    # Every 30 min from 8:00 AM to 5:30 PM America/Phoenix (UTC-7)
    - cron: "*/30 15-23,0 * * *"
    # 6:00 PM America/Phoenix
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: flip-auto-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build config from template + GitHub Secrets
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_LOOKBACK_HOURS: ${{ secrets.EMAIL_LOOKBACK_HOURS }}
          ZOHO_EMAIL_USERNAME: ${{ secrets.ZOHO_EMAIL_USERNAME }}
          ZOHO_EMAIL_APP_PASSWORD: ${{ secrets.ZOHO_EMAIL_APP_PASSWORD }}
          ZOHO_IMAP_HOST: ${{ secrets.ZOHO_IMAP_HOST }}
          ZOHO_FOLDER: ${{ secrets.ZOHO_FOLDER }}
          ZOHO_LOOKBACK_HOURS: ${{ secrets.ZOHO_LOOKBACK_HOURS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUD_CMA_API_KEY: ${{ secrets.CLOUD_CMA_API_KEY }}
          GSHEET_PUBLIC_CSV_URL: ${{ secrets.GSHEET_PUBLIC_CSV_URL }}
          GSHEET_PUBLIC_URL: ${{ secrets.GSHEET_PUBLIC_URL }}
          GSHEET_SPREADSHEET_ID: ${{ secrets.GSHEET_SPREADSHEET_ID }}
          GSHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.GSHEET_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import yaml
          from pathlib import Path

          required = [
              "EMAIL_USERNAME",
              "EMAIL_APP_PASSWORD",
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID",
          ]
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              raise SystemExit(f"Missing required GitHub secrets: {', '.join(missing)}")

          template_path = Path("config.example.yaml")
          cfg = yaml.safe_load(template_path.read_text(encoding="utf-8")) or {}

          cfg.setdefault("email", {})["username"] = os.environ["EMAIL_USERNAME"]
          cfg.setdefault("email", {})["password"] = os.environ["EMAIL_APP_PASSWORD"]

          email_cfg = cfg.setdefault("email", {})
          lookback_hours = os.getenv("EMAIL_LOOKBACK_HOURS", "").strip()
          if lookback_hours:
              email_cfg["lookback_hours"] = int(lookback_hours)

          zoho_username = os.getenv("ZOHO_EMAIL_USERNAME", "").strip()
          zoho_password = os.getenv("ZOHO_EMAIL_APP_PASSWORD", "").strip()
          if zoho_username and zoho_password:
              zoho_account = {
                  "label": "zoho",
                  "enabled": True,
                  "imap_host": os.getenv("ZOHO_IMAP_HOST", "").strip() or "imap.zoho.com",
                  "username": zoho_username,
                  "password": zoho_password,
                  "folder": os.getenv("ZOHO_FOLDER", "").strip() or "Off-Market-Deals",
                  "sender_filters": [],
                  "subject_filters": [],
                  "sender_subject_filters": {},
              }
              zoho_lookback_hours = os.getenv("ZOHO_LOOKBACK_HOURS", "").strip()
              if zoho_lookback_hours:
                  zoho_account["lookback_hours"] = int(zoho_lookback_hours)
              email_cfg.setdefault("accounts", [])
              email_cfg["accounts"] = [
                  account
                  for account in email_cfg["accounts"]
                  if account.get("label") != "zoho"
              ]
              email_cfg["accounts"].append(zoho_account)

          cfg.setdefault("telegram", {})["bot_token"] = os.environ["TELEGRAM_BOT_TOKEN"]
          cfg.setdefault("telegram", {})["chat_id"] = os.environ["TELEGRAM_CHAT_ID"]

          cloud_cma_api_key = os.getenv("CLOUD_CMA_API_KEY", "").strip()
          if cloud_cma_api_key:
              cfg["valuation"] = {
                  "enabled": True,
                  "provider": "cloud_cma",
                  "api_key": cloud_cma_api_key,
                  "result_email": os.environ["EMAIL_USERNAME"],
                  "result_account_label": "email",
                  "result_folder": "INBOX",
                  "result_lookback_hours": 72,
                  "template": "Web Leads",
                  "min_listings": 25,
                  "max_requests_per_run": 3,
                  "max_requests_per_day": 10,
                  "request_ttl_days": 30,
                  "max_report_mb": 80,
                  "max_radius": 1.0,
                  "days_old": 180,
                  "size_tolerance": 0.20,
                  "year_tolerance": 10,
                  "minimum_comps": 3,
              }
              cfg["screening"] = {
                  "enabled": True,
                  "target_profit": 50000,
                  "selling_cost_percent": 0.07,
                  "other_costs": 12000,
                  "max_basis_percent": 0.80,
                  "default_rehab_per_sqft": 20,
                  "fallback_rehab": 35000,
              }

          gsheet_public_csv_url = os.getenv("GSHEET_PUBLIC_CSV_URL", "").strip()
          gsheet_public_url = os.getenv("GSHEET_PUBLIC_URL", "").strip()
          gsheet_spreadsheet_id = os.getenv("GSHEET_SPREADSHEET_ID", "").strip()
          gsheet_service_account_json = os.getenv("GSHEET_SERVICE_ACCOUNT_JSON", "").strip()

          gsheet_cfg = cfg.setdefault("gsheet", {})
          gsheet_cfg["public_csv_url"] = gsheet_public_csv_url
          gsheet_cfg["public_url"] = gsheet_public_url

          if not gsheet_public_csv_url and not gsheet_public_url and not gsheet_service_account_json:
              raise SystemExit(
                  "Set GSHEET_PUBLIC_CSV_URL, GSHEET_PUBLIC_URL, or GSHEET_SERVICE_ACCOUNT_JSON for sheet access."
              )

          # Prefer public-sheet mode when public URL is available.
          if gsheet_public_csv_url:
              gsheet_cfg["public_url"] = ""
          elif gsheet_public_url:
              if not gsheet_spreadsheet_id:
                  match = re.search(r"/spreadsheets/d/([a-zA-Z0-9-_]+)", gsheet_public_url)
                  if match:
                      gsheet_spreadsheet_id = match.group(1)
              if gsheet_spreadsheet_id:
                  gsheet_cfg["spreadsheet_id"] = gsheet_spreadsheet_id
          elif gsheet_service_account_json:
              if not gsheet_spreadsheet_id:
                  raise SystemExit(
                      "GSHEET_SPREADSHEET_ID is required when GSHEET_SERVICE_ACCOUNT_JSON is set."
                  )
              creds_dir = Path("creds")
              creds_dir.mkdir(parents=True, exist_ok=True)
              creds_path = creds_dir / "google-service-account.json"
              parsed = json.loads(gsheet_service_account_json)
              creds_path.write_text(json.dumps(parsed), encoding="utf-8")
              gsheet_cfg["credentials_json"] = str(creds_path)
              gsheet_cfg["public_url"] = ""
              gsheet_cfg["spreadsheet_id"] = gsheet_spreadsheet_id

          Path("config.yaml").write_text(
              yaml.safe_dump(cfg, sort_keys=False),
              encoding="utf-8",
          )
          PY

      - name: Run monitor
        run: python monitor.py

      - name: Commit updated state file
        shell: bash
        run: |
          if [ ! -f state/monitor_state.json ]; then
            echo "No state file to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/monitor_state.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "chore: update monitor state [skip ci]"
          git push
