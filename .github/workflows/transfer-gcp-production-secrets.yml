name: Transfer production secrets to GCP

# A distinct workflow/pool keeps the completed core and Zoho transfers revoked.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type COPY-PRODUCTION-SECRETS exactly
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: flip-auto-gcp-production-secret-transfer
  cancel-in-progress: false

jobs:
  transfer_production:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository_id == '1172251948' &&
      github.repository_owner_id == '22221409'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: main
    env:
      ACTIONS_STEP_DEBUG: 'false'
      ACTIONS_RUNNER_DEBUG: 'false'
      CLOUDSDK_CORE_DISABLE_FILE_LOGGING: 'true'
      CLOUDSDK_CORE_LOG_HTTP: 'false'
      CLOUDSDK_CORE_VERBOSITY: error
      CLOUDSDK_CORE_DISABLE_USAGE_REPORTING: 'true'
      CLOUDSDK_CORE_DISABLE_PROMPTS: 'true'
    steps:
      - name: Validate production transfer confirmation
        env:
          TRANSFER_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          if [[ "$TRANSFER_CONFIRMATION" != "COPY-PRODUCTION-SECRETS" ]]; then
            printf '%s\n' '::error::Enter COPY-PRODUCTION-SECRETS exactly in the confirmation field. Nothing was copied.' >&2
            exit 1
          fi

      - name: Refuse debug logging
        shell: bash
        run: |
          if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
            printf 'Secret transfer refuses debug logging. Start a fresh run with debugging disabled.\n' >&2
            exit 1
          fi

      - name: Checkout the dispatched commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check production settings before authentication
        env:
          EMAIL_LOOKBACK_HOURS: ${{ secrets.EMAIL_LOOKBACK_HOURS }}
          ZOHO_IMAP_HOST: ${{ secrets.ZOHO_IMAP_HOST }}
          ZOHO_FOLDER: ${{ secrets.ZOHO_FOLDER }}
          ZOHO_LOOKBACK_HOURS: ${{ secrets.ZOHO_LOOKBACK_HOURS }}
          GSHEET_PUBLIC_CSV_URL: ${{ secrets.GSHEET_PUBLIC_CSV_URL }}
          GSHEET_PUBLIC_URL: ${{ secrets.GSHEET_PUBLIC_URL }}
          GSHEET_SPREADSHEET_ID: ${{ secrets.GSHEET_SPREADSHEET_ID }}
        shell: bash
        run: python3 -I deploy/gcp/transfer-secrets.py --check-production-config

      - name: Set up gcloud without caching
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '>= 363.0.0'
          cache: false

      - name: Authenticate through the dedicated production transfer provider
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: flip-auto
          workload_identity_provider: projects/941818435041/locations/global/workloadIdentityPools/flip-auto-live-secret-transfer/providers/github
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      # This identity can only add versions to four fixed destinations. Settings
      # are synthesized in memory; the service account JSON is never transferred.
      # Every rerun adds versions. A failed request may have committed: no retries.
      # This workflow does not deploy, start workloads, or change the live owner.
      - name: Copy exactly four production secrets
        env:
          CLOUD_CMA_API_KEY: ${{ secrets.CLOUD_CMA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_LOOKBACK_HOURS: ${{ secrets.EMAIL_LOOKBACK_HOURS }}
          ZOHO_IMAP_HOST: ${{ secrets.ZOHO_IMAP_HOST }}
          ZOHO_FOLDER: ${{ secrets.ZOHO_FOLDER }}
          ZOHO_LOOKBACK_HOURS: ${{ secrets.ZOHO_LOOKBACK_HOURS }}
          GSHEET_PUBLIC_CSV_URL: ${{ secrets.GSHEET_PUBLIC_CSV_URL }}
          GSHEET_PUBLIC_URL: ${{ secrets.GSHEET_PUBLIC_URL }}
          GSHEET_SPREADSHEET_ID: ${{ secrets.GSHEET_SPREADSHEET_ID }}
        shell: bash
        run: python3 -I deploy/gcp/transfer-secrets.py --profile production
