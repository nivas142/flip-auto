name: Valuation smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/valuation-smoke-test.yml
      - scripts/valuation_smoke_test.py

permissions:
  contents: read

jobs:
  test-existing-cloud-cma:
    runs-on: ubuntu-latest
    environment: main
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Parse, value, screen, and send test alert
        env:
          PYTHONPATH: ${{ github.workspace }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/valuation_smoke_test.py
