name: Transfer shadow secrets to GCP

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Fixed secret set (Zoho does not repeat the completed core transfer)
        required: true
        type: choice
        default: core
        options:
          - core
          - zoho
      confirmation:
        description: Type COPY-THREE-SHADOW-SECRETS for core or COPY-TWO-ZOHO-SECRETS for zoho
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: flip-auto-gcp-secret-transfer
  cancel-in-progress: false

jobs:
  transfer:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository_id == '1172251948' &&
      github.repository_owner_id == '22221409' &&
      (inputs.profile == 'core' || inputs.profile == '') &&
      inputs.confirmation == 'COPY-THREE-SHADOW-SECRETS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: main
    env:
      ACTIONS_STEP_DEBUG: 'false'
      ACTIONS_RUNNER_DEBUG: 'false'
      CLOUDSDK_CORE_DISABLE_FILE_LOGGING: 'true'
      CLOUDSDK_CORE_LOG_HTTP: 'false'
      CLOUDSDK_CORE_VERBOSITY: error
      CLOUDSDK_CORE_DISABLE_USAGE_REPORTING: 'true'
      CLOUDSDK_CORE_DISABLE_PROMPTS: 'true'
    steps:
      - name: Refuse debug logging
        shell: bash
        run: |
          if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
            printf 'Secret transfer refuses debug logging. Start a fresh run with debugging disabled.\n' >&2
            exit 1
          fi

      - name: Checkout the dispatched commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Install before auth to leave the short-lived federated token window for
      # the transfer. The helper uses auth's credential-file override directly.
      - name: Set up gcloud without caching
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '>= 363.0.0'
          cache: false

      - name: Authenticate through the dedicated direct WIF provider
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: flip-auto
          workload_identity_provider: projects/941818435041/locations/global/workloadIdentityPools/flip-auto-secret-transfer/providers/github
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      # This identity has only secretVersionAdder on the three destination
      # secrets. It cannot list/access payloads, so this is not idempotent:
      # rerunning adds versions even when values are unchanged. There are no
      # retries, credential artifacts, caches, or runtime deployment steps.
      - name: Copy exactly the three shadow credentials
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          CLOUD_CMA_WEBHOOK_SECRET: ${{ secrets.CLOUD_CMA_WEBHOOK_SECRET }}
        shell: bash
        run: python3 -I deploy/gcp/transfer-secrets.py

  transfer_zoho:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository_id == '1172251948' &&
      github.repository_owner_id == '22221409' &&
      inputs.profile == 'zoho' &&
      inputs.confirmation == 'COPY-TWO-ZOHO-SECRETS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: main
    env:
      ACTIONS_STEP_DEBUG: 'false'
      ACTIONS_RUNNER_DEBUG: 'false'
      CLOUDSDK_CORE_DISABLE_FILE_LOGGING: 'true'
      CLOUDSDK_CORE_LOG_HTTP: 'false'
      CLOUDSDK_CORE_VERBOSITY: error
      CLOUDSDK_CORE_DISABLE_USAGE_REPORTING: 'true'
      CLOUDSDK_CORE_DISABLE_PROMPTS: 'true'
    steps:
      - name: Refuse debug logging
        shell: bash
        run: |
          if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
            printf 'Secret transfer refuses debug logging. Start a fresh run with debugging disabled.\n' >&2
            exit 1
          fi

      - name: Checkout the dispatched commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check Zoho settings against reviewed shadow defaults
        env:
          ZOHO_IMAP_HOST: ${{ secrets.ZOHO_IMAP_HOST }}
          ZOHO_FOLDER: ${{ secrets.ZOHO_FOLDER }}
          ZOHO_LOOKBACK_HOURS: ${{ secrets.ZOHO_LOOKBACK_HOURS }}
          EMAIL_LOOKBACK_HOURS: ${{ secrets.EMAIL_LOOKBACK_HOURS }}
        shell: bash
        run: python3 -I deploy/gcp/transfer-secrets.py --check-zoho-config

      # Install before auth to leave the short-lived federated token window for
      # the transfer. The helper uses auth's credential-file override directly.
      - name: Set up gcloud without caching
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '>= 363.0.0'
          cache: false

      - name: Authenticate through the dedicated direct WIF provider
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: flip-auto
          workload_identity_provider: projects/941818435041/locations/global/workloadIdentityPools/flip-auto-zoho-secret-transfer/providers/github
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      # This identity has only secretVersionAdder on the two destination
      # secrets. It cannot list/access payloads, so this is not idempotent:
      # rerunning adds versions even when values are unchanged. There are no
      # retries, credential artifacts, caches, or runtime deployment steps.
      - name: Copy exactly the two Zoho credentials
        env:
          ZOHO_EMAIL_USERNAME: ${{ secrets.ZOHO_EMAIL_USERNAME }}
          ZOHO_EMAIL_APP_PASSWORD: ${{ secrets.ZOHO_EMAIL_APP_PASSWORD }}
        shell: bash
        run: python3 -I deploy/gcp/transfer-secrets.py --profile zoho
