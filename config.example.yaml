# Copy this to config.yaml and fill in your values.

state_file: state/monitor_state.json

email:
  enabled: true
  imap_host: imap.gmail.com
  username: REPLACE_WITH_EMAIL_USERNAME
  password: REPLACE_WITH_EMAIL_APP_PASSWORD
  folder: INBOX
  # Optional. If set, overrides lookback_minutes with a clearer hour-based window.
  lookback_hours: 48
  lookback_minutes: 120
  sender_filters:
    - deals@exohomesolutions.com
    - everett.williams-first48offers.com@shared1.ccsend.com
    - jeremiah@networthaz.com
    - deals@carterbuysaz.com
    - chris@networthaz.com
    - techme2@outlook.com
    - offers.tim.lange@gmail.com
    - nivas.966@gmail.com
    - michael@betterhomeofferllc.com
    - dispo@sellwholesalehouses.com
    - listingupdates@flexmail.flexmls.com
  subject_filters: []
  sender_subject_filters:
    listingupdates@flexmail.flexmls.com:
      - Copy: Subscription Investing
  cities:
    - Chandler
    - Gilbert
    - Queen Creek
    - Flagstaff
    - Mesa
    - Sedona
  # Optional. Add more IMAP mailboxes here. Each account can inherit the
  # top-level sender_filters/cities unless you override them per account.
  accounts:
    - label: zoho
      enabled: false
      imap_host: imap.zoho.com
      username: nivas@homesbynivas.com
      password: REPLACE_WITH_ZOHO_APP_PASSWORD
      folder: Off-Market-Deals
      lookback_hours: 48
      sender_filters: []
      subject_filters: []
      sender_subject_filters: {}
      cities:
        - Chandler
        - Gilbert
        - Queen Creek
        - Flagstaff
        - Mesa
        - Sedona

gsheet:
  enabled: true
  # Easiest option: publish/share the tab as CSV and paste the export URL here.
  public_csv_url:
  public_url: https://docs.google.com/spreadsheets/d/REPLACE_WITH_SHEET_ID/edit?gid=0#gid=0
  public_gid: 0
  credentials_json: creds/google-service-account.json
  spreadsheet_id: REPLACE_WITH_SHEET_ID
  worksheet: Sheet1
  # City matching checks city_column first, then column A, then the full row.
  city_column: city
  row_id_column: id
  content_columns:
    - address
    - price
    - notes
    - link
  cities:
    - Chandler
    - Gilbert
    - Queen Creek
    - Flagstaff
    - Mesa
    - Sedona

telegram:
  enabled: true
  bot_token: REPLACE_WITH_TELEGRAM_BOT_TOKEN
  chat_id: REPLACE_WITH_TELEGRAM_CHAT_ID

twilio:
  enabled: false
  account_sid: REPLACE_WITH_TWILIO_ACCOUNT_SID
  auth_token: REPLACE_WITH_TWILIO_AUTH_TOKEN
  messaging_service_sid: REPLACE_WITH_TWILIO_MESSAGING_SERVICE_SID
  from_number: "+1REPLACE_WITH_TWILIO_NUMBER"
  to_number: "+1REPLACE_WITH_DESTINATION_NUMBER"

valuation:
  enabled: false
  provider: cloud_cma
  api_key: REPLACE_WITH_CLOUD_CMA_API_KEY
  callback_base_url: https://flip-auto-cma-callback.REPLACE_WITH_SUBDOMAIN.workers.dev
  callback_secret: REPLACE_WITH_WEBHOOK_SECRET
  template: Web Leads
  min_listings: 25
  max_requests_per_run: 1
  max_requests_per_day: 10
  request_ttl_days: 30
  # Cloud CMA reports include listing photos and commonly exceed 80 MB.
  max_report_mb: 200
  max_radius: 1.0
  days_old: 180
  size_tolerance: 0.20
  year_tolerance: 10
  minimum_comps: 3

screening:
  enabled: false
  target_profit: 50000
  selling_cost_percent: 0.07
  other_costs: 12000
  max_basis_percent: 0.80
  default_rehab_per_sqft: 20
  fallback_rehab: 35000
